<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PC Game Deals</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #0f172a;
        --surface: #18243a;
        --surface-hover: #20304d;
        --border: #334155;
        --text: #f8fafc;
        --muted: #a8b3c7;
        --accent: #42d392;
        --accent-dark: #123b2b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        max-width: 1100px;
        margin: 0 auto;
        padding: 48px 20px;
        background: var(--background);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
      }

      h1, h2 {
        margin: 0;
      }

      h1 {
        margin-bottom: 8px;
        font-size: clamp(32px, 6vw, 52px);
        letter-spacing: -0.04em;
      }

      .subtitle {
        margin: 0 0 28px;
        color: var(--muted);
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: rgba(24, 36, 58, 0.8);
      }

      .search-input {
        min-width: 0;
        flex: 1;
        height: 44px;
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 0 14px;
        background: #0f172a;
        color: var(--text);
        font: inherit;
      }

      .search-input:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .sale-filter {
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
        color: #dce4f0;
        cursor: pointer;
      }

      .sale-filter input {
        width: 18px;
        height: 18px;
        accent-color: var(--accent);
      }

      .game-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 16px;
      }

      .game-card {
        position: relative;
        min-width: 0;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
        transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
      }

      .game-card:hover {
        transform: translateY(-3px);
        border-color: #4d627f;
        background: var(--surface-hover);
      }

      .game-thumb {
        width: 100%;
        height: 150px;
        object-fit: cover;
        background: #263650;
      }

      .game-content {
        padding: 16px;
      }

      .game-title {
        min-height: 48px;
        margin: 0 0 12px;
        font-size: 17px;
        line-height: 1.4;
      }

      .normal-price {
        color: var(--muted);
        text-decoration: line-through;
      }

      .sale-price {
        color: var(--accent);
        font-weight: bold;
      }

      .sale-tag {
        display: inline-block;
        margin-bottom: 12px;
        padding: 4px 8px;
        border-radius: 999px;
        background: var(--accent);
        color: #07140f;
        font-size: 12px;
        font-weight: 800;
      }

      .price-label {
        margin: 4px 0;
        color: var(--muted);
      }

      .discount {
        margin: 10px 0 0;
        color: var(--accent);
        font-weight: 800;
      }

      #cheapest-game .game-card {
        max-width: 420px;
      }

      .status,
      .empty-state {
        padding: 24px;
        border: 1px dashed var(--border);
        border-radius: 12px;
        color: var(--muted);
      }

      section + section {
        margin-top: 36px;
      }

      @media (max-width: 600px) {
        body {
          padding-top: 28px;
        }

        .controls {
          align-items: stretch;
          flex-direction: column;
        }

        .sale-filter {
          min-height: 36px;
        }
      }
    </style>
  </head>
  <body>
    <h1>PC Game Deals</h1>
    <p class="subtitle">Browse today’s best PC game prices.</p>

    <div class="controls" role="search">
      <input
        id="search-input"
        class="search-input"
        type="search"
        placeholder="Search games..."
        aria-label="Search games"
      >
      <label class="sale-filter">
        <input id="sale-only" type="checkbox">
        On sale only
      </label>
    </div>

    <section aria-labelledby="games-heading">
      <h2 id="games-heading">All Games</h2>
      <div id="games-list" class="game-grid">
        <p class="status">Loading deals...</p>
      </div>
    </section>

    <section aria-labelledby="cheapest-heading">
      <h2 id="cheapest-heading">Cheapest Game Right Now</h2>
      <div id="cheapest-game"></div>
    </section>

    <script src="app.js"></script>
  </body>
</html>
